services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    volumes:
      # Postgres 18+ images store data per major version under /var/lib/postgresql.
      - pgdata_transactional_template:/var/lib/postgresql

volumes:
  # Transactional database to support the API.
  # TODO: Replace template reference below.
  pgdata_transactional_template:
